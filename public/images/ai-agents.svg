<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Central agent node -->
  <circle cx="64" cy="64" r="18" fill="#06B6D4"/>
  <circle cx="64" cy="64" r="11" fill="#0E7490"/>
  <!-- Agent eye/sensor -->
  <circle cx="64" cy="61" r="4" fill="#CFFAFE"/>
  <circle cx="64" cy="61" r="2" fill="#06B6D4"/>
  <!-- Agent mouth/indicator -->
  <rect x="59" y="68" width="10" height="2.5" rx="1.25" fill="#CFFAFE"/>
  <!-- Tool nodes (4 directions) -->
  <!-- Top - Code tool -->
  <rect x="56" y="8" width="16" height="16" rx="3" fill="#10B981"/>
  <text x="64" y="19" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">&lt;/&gt;</text>
  <!-- Right - Data tool -->
  <rect x="104" y="56" width="16" height="16" rx="3" fill="#F59E0B"/>
  <rect x="108" y="60" width="3" height="8" rx="1" fill="#FEF3C7"/>
  <rect x="113" y="62" width="3" height="6" rx="1" fill="#FEF3C7"/>
  <!-- Bottom - Deploy tool -->
  <rect x="56" y="104" width="16" height="16" rx="3" fill="#EF4444"/>
  <path d="M64 108L69 114H59L64 108Z" fill="#FEE2E2"/>
  <!-- Left - Think tool -->
  <rect x="8" y="56" width="16" height="16" rx="3" fill="#8B5CF6"/>
  <circle cx="16" cy="64" r="4" fill="#DDD6FE"/>
  <circle cx="16" cy="64" r="1.5" fill="#8B5CF6"/>
  <!-- Connection lines from center to tools -->
  <line x1="64" y1="46" x2="64" y2="28" stroke="#06B6D4" stroke-width="2.5"/>
  <line x1="82" y1="64" x2="104" y2="64" stroke="#06B6D4" stroke-width="2.5"/>
  <line x1="64" y1="82" x2="64" y2="104" stroke="#06B6D4" stroke-width="2.5"/>
  <line x1="46" y1="64" x2="28" y2="64" stroke="#06B6D4" stroke-width="2.5"/>
  <!-- Signal pulses on connections -->
  <circle cx="64" cy="37" r="2" fill="#CFFAFE"/>
  <circle cx="93" cy="64" r="2" fill="#CFFAFE"/>
  <circle cx="64" cy="93" r="2" fill="#CFFAFE"/>
  <circle cx="37" cy="64" r="2" fill="#CFFAFE"/>
</svg>
